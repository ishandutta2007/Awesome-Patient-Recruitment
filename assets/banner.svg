<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="40%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#05101E"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#3B82F6;#8B5CF6;#06B6D4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#8B5CF6;#06B6D4;#3B82F6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#06B6D4;#3B82F6;#10B981" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes waveMotion {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      .animated-pulse {
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out 1s infinite; }
      .particle-3 { animation: floatParticle 6s ease-in-out 2s infinite; }
      .ecg-line {
        stroke-dasharray: 200, 20;
        animation: waveMotion 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="750" y1="0" x2="750" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1050" y1="0" x2="1050" y2="380"/>
  </g>

  <!-- Glowing Abstract Network / Nodes (Left & Right) -->
  <g opacity="0.6">
    <line x1="100" y1="80" x2="220" y2="150" stroke="#0EA5E9" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="220" y1="150" x2="140" y2="270" stroke="#0EA5E9" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="140" y1="270" x2="80" y2="200" stroke="#0EA5E9" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="100" y1="80" x2="80" y2="200" stroke="#0EA5E9" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <line x1="1060" y1="90" x2="1130" y2="180" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="1130" y1="180" x2="1040" y2="280" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="1040" y1="280" x2="970" y2="160" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="970" y1="160" x2="1060" y2="90" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Floating Glowing Particles -->
  <circle cx="100" cy="80" r="5" fill="#38BDF8" filter="url(#softGlow)" class="particle-1"/>
  <circle cx="220" cy="150" r="7" fill="#06B6D4" filter="url(#softGlow)" class="particle-2"/>
  <circle cx="140" cy="270" r="6" fill="#3B82F6" filter="url(#softGlow)" class="particle-3"/>
  <circle cx="80" cy="200" r="4" fill="#10B981" filter="url(#softGlow)" class="particle-1"/>

  <circle cx="1060" cy="90" r="6" fill="#A855F7" filter="url(#softGlow)" class="particle-2"/>
  <circle cx="1130" cy="180" r="7" fill="#6366F1" filter="url(#softGlow)" class="particle-1"/>
  <circle cx="1040" cy="280" r="5" fill="#EC4899" filter="url(#softGlow)" class="particle-3"/>
  <circle cx="970" cy="160" r="6" fill="#38BDF8" filter="url(#softGlow)" class="particle-2"/>

  <!-- Clinical ECG Wave at Bottom -->
  <path class="ecg-line" d="M0,330 L350,330 L370,305 L385,355 L400,285 L415,345 L430,325 L445,330 L750,330 L770,305 L785,355 L800,285 L815,345 L830,325 L845,330 L1200,330" 
        fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.75" filter="url(#softGlow)"/>

  <!-- Central Badge/Icon -->
  <g transform="translate(600, 80)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="30;46;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="0" cy="0" r="30" fill="url(#cardGrad)" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#softGlow)"/>
    
    <path d="M-6,-15 H6 V-6 H15 V6 H6 V15 H-6 V6 H-15 V-6 H-6 Z" fill="url(#accentGrad)"/>
  </g>

  <!-- Title Text -->
  <g text-anchor="middle">
    <rect x="420" y="132" width="360" height="28" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1"/>
    <text x="600" y="151" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2">
      CLINICAL RESEARCH &amp; RECRUITMENT ECOSYSTEM
    </text>

    <text x="600" y="210" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Patient Recruitment
    </text>

    <text x="600" y="252" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" filter="url(#softGlow)">
      SaaS Platforms • Open-Source Cohort Discovery • OMOP / FHIR Matching • Eligibility AI
    </text>

    <text x="600" y="285" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Curated infrastructure for Clinical Trial Matching, EHR Phenotyping, eConsent, &amp; Decentralized Studies
    </text>
  </g>
</svg>
